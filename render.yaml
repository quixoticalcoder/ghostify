services:
  - type: web
    name: ghostify
    runtime: docker
    plan: free
    autoDeployTrigger: off
    healthCheckPath: /_stcore/health
    envVars:
      - key: GOOGLE_API_KEY
        sync: false
      - key: GHOSTIFY_ACCESS_PASSWORD
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.5-flash-lite
      - key: GHOSTIFY_ALLOWED_OWNERS
        value: quixoticalcoder
      - key: LANGCHAIN_TRACING_V2
        value: "false"
      - key: LANGSMITH_TRACING
        value: "false"
